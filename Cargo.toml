[package]
name = "opencode-herdr-sidebar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fork the current OpenCode session into a reusable Herdr side pane"
license = "MIT"
repository = "https://github.com/mcostasilva/opencode-herdr-sidebar"
readme = "README.md"
keywords = ["opencode", "herdr", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
