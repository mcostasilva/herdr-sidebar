id = "herdr-sidebar"
name = "Herdr Sidebar"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Fork the current OpenCode conversation to the right, or focus its existing side pane"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "--target-dir", "target"]

[[actions]]
id = "open"
title = "Sidebar: fork or focus side pane"
contexts = ["pane"]
command = ["target/release/herdr-sidebar", "open"]

[[panes]]
id = "session"
title = "Side session"
placement = "split"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-sidebar" attach']
